[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ligase"
version = "0.0.1"
description = "Join what protein ML keeps apart: sequence language models and structure graphs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew Salem" }]
keywords = ["bioinformatics", "protein-language-models", "graph-neural-networks", "esm2", "pytorch"]
dependencies = [
    "numpy>=1.24",
    "torch>=2.3",
    "torch-geometric>=2.5",
    "gemmi>=0.6.5",
    "h5py>=3.9",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
esm = ["transformers>=4.40"]
viz = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.7",
]


[project.scripts]
ligase = "ligase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ligase"]


[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs CUDA; deselect with -m 'not gpu'",
    "slow: downloads real model weights; deselect with -m 'not slow'",
]
filterwarnings = ["ignore:`torch.jit.script` is deprecated:FutureWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
